search_price:
  name: Search fuel prices
  description: >-
    Return the cheapest nearby fuel stations for a location and fuel grade,
    using the UK Fuel Finder open-data scheme. Provide either latitude+longitude
    or a postcode. Returns response data (use response_variable).
  fields:
    latitude:
      name: Latitude
      description: Centre latitude of the search (omit if using postcode).
      required: false
      example: 53.2769
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      name: Longitude
      description: Centre longitude of the search (omit if using postcode).
      required: false
      example: -0.6608
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    postcode:
      name: Postcode
      description: UK postcode to search around (used if lat/long not given).
      required: false
      example: "LN1 1XX"
      selector:
        text:
    radius_km:
      name: Radius
      description: >-
        Search radius in the chosen unit (km by default, miles if unit is set
        to miles). Default is 8 km / 5 miles.
      required: false
      default: 8
      example: 8
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          mode: slider
    unit:
      name: Unit
      description: Distance unit for the radius input and distance output.
      required: false
      default: km
      selector:
        select:
          options:
            - label: Kilometres (km)
              value: km
            - label: Miles
              value: miles
    fuel_type:
      name: Fuel type
      description: Fuel grade to compare.
      required: false
      default: E5
      selector:
        select:
          options:
            - "E5"
            - "E10"
            - "B7"
            - "SDV"
    limit:
      name: Max results
      description: Maximum number of stations to return.
      required: false
      default: 5
      example: 5
      selector:
        number:
          min: 1
          max: 25
          step: 1
          mode: box
